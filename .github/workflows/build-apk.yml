name: Build Godot Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Download Godot 4.3 and Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Generate debug signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Android SDK
        run: |
          mkdir -p scripts
          cat > /tmp/configure_android.gd <<'GDSCRIPT'
          extends SceneTree

          func _initialize():
              var settings = EditorInterface.get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/java_sdk_path", OS.get_environment("JAVA_HOME"))
              settings.save()
              quit()
          GDSCRIPT
          ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --script /tmp/configure_android.gd

      - name: Import Godot assets
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Export debug APK
        env:
          GODOT_ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          GODOT_JAVA_HOME: ${{ env.JAVA_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          cp "$HOME/.android/debug.keystore" debug.keystore
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/MOBA-1V1.apk
          test -s build/MOBA-1V1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MOBA-1V1-Android-APK
          path: build/MOBA-1V1.apk
          if-no-files-found: error
